services: 
  - type: web 
    name: superenalotto-api 
    env: python 
    region: frankfurt 
    rootDir: backend 
    buildCommand: pip install --upgrade pip setuptools wheel && pip install -r requirements.txt 
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120 
    envVars: 
      - key: PYTHON_VERSION 
        value: 3.11.7 
      - key: FLASK_ENV 
        value: production 
      - key: SECRET_KEY 
        generateValue: true 
      - key: FREE_TRIAL_DAYS 
        value: "3" 
      - key: PIP_NO_CACHE_DIR 
        value: "1" 
