services: 
  - type: web 
    name: superenalotto-api 
    env: python 
    region: frankfurt 
    buildCommand: pip install -r requirements.txt 
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT 
    envVars: 
      - key: FLASK_ENV 
        value: production 
      - key: SECRET_KEY 
        generateValue: true 
      - key: FREE_TRIAL_DAYS 
        value: "3" 
