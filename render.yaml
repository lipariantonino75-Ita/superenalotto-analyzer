services:
  - type: web
    name: superenalotto-api
    env: python
    region: frankfurt
    rootDir: backend
Defaulting to user installation because normal site-packages is not writeable
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.7
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: FREE_TRIAL_DAYS
        value: "3"
